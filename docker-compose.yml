services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Бесплатный HTTPS-туннель Cloudflare до твоего компа (Mini App работает только по https).
  # Адрес *.trycloudflare.com меняется при перезапуске — бот сам его подхватит
  # и обновит кнопку меню (см. TUNNEL_METRICS_URL в .env).
  # Запуск: docker compose --profile tunnel up -d --build
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8000
    depends_on: [app]
    restart: unless-stopped
